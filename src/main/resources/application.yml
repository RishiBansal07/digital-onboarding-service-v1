spring:
  application:
    name: digital-onboarding-service
  datasource:
    url: jdbc:h2:mem:digitalonboardingservice
    driver-class-name: org.h2.Driver
    username: admin
    password: admin
    # Database connection pool configuration
    hikari:
      maximum-pool-size: 5          # Allow 5 connections for concurrent operations
      minimum-idle: 2                # Keep 2 connections warm
      connection-timeout: 10000      # Wait up to 10 seconds for connection
      idle-timeout: 300000           # Close idle connections after 5 minutes
      max-lifetime: 1200000          # Max connection lifetime: 20 minutes
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8085

springdoc:
  api-docs:
    # Preserve the existing API document format across the Springdoc upgrade.
    version: OPENAPI_3_0

logging:
  level:
    root: INFO
    com.randombank.onboarding: INFO
    org.springframework.web: WARN
  pattern: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  db:
    # Repository operations are started at most twice per second per application instance.
    max-operations-per-second: 2
  registration:
    # Comma-separated so it resolves as a single property value.
    # Add a country by extending this list, e.g. NL,BE,DE
    allowed-countries: NL,BE
